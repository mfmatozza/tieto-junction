<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vouch · EasyReview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27%3E%3Crect width=%2726%27 height=%2726%27 rx=%277%27 fill=%27%23111d42%27/%3E%3Cpath d=%27M7 7.5 13 18.5 19 7.5%27 fill=%27none%27 stroke=%27%2386efac%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root {
  --bg: #ffffff; --bg-2: #f7f8fb; --surface: #f3f5f9; --surface-2: #eceff5;
  --line: #e6e9ef; --line-2: #d3d9e3;
  --text: #0b1533; --muted: #4b5675; --dim: #7c869e;
  --green: #15803d; --green-ink: #ffffff; --green-soft: #dcfce7;
  --red: #dc2626; --red-soft: #fee2e2; --amber: #b45309; --amber-soft: #fef3c7;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.16,1,.3,1);
  --navy: #0f1f4d; --navy-2: #1b2f6b; --hl: #bbf7d0;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
code { font: 12.5px var(--mono); background: rgba(15,31,77,0.044); padding: 1px 6px; border-radius: 5px; }
.g { color: var(--green); } .r { color: var(--red); } .a { color: var(--amber); } .m { color: var(--muted); } .d { color: var(--dim); }

/* Header (same as the board) */
header.bar { border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; }
header.bar .in { height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 24px; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.crumb { color: var(--dim); display: flex; align-items: center; gap: 12px; font-size: 14px; min-width: 0; }
.crumb a { color: var(--muted); white-space: nowrap; }
.crumb a:hover { color: var(--text); }
.crumb .cur { color: var(--text); white-space: nowrap; }
.right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); }
.avs { display: flex; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 10.5px var(--sans); color: #0a1230; border: 2px solid var(--bg); margin-left: -6px; flex: none; }
.avs .av:first-child { margin-left: 0; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; font: 500 14px/1 var(--sans); white-space: nowrap; border: 1px solid transparent; transition: transform .15s var(--ease), background .2s, border-color .2s, color .2s; }
.btn:active { transform: scale(.97); }
.btn i { font-size: 16px; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-2); }
.btn-ghost { border-color: var(--line-2); }
.btn-ghost:hover { background: rgba(15,31,77,0.033); border-color: rgba(15,31,77,0.193); }
.btn-ghost.on-problem { border-color: rgba(220,38,38,0.5); color: var(--red); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.icon-btn { width: 36px; padding: 0; justify-content: center; }

/* Page */
.page { max-width: 1440px; margin: 0 auto; padding: 28px 24px 120px; }
.top h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; max-width: 60ch; }
.top h1 .id { color: var(--dim); font-weight: 400; font-family: var(--mono); font-size: 18px; margin-right: 10px; }
.meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: 14px; color: var(--muted); }
.meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.prog { margin-top: 18px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--green); transition: width .5s var(--ease); }

.layout { margin-top: 24px; display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 32px; align-items: start; }
.rail { position: sticky; top: 84px; max-height: calc(100dvh - 100px); overflow: auto; }
.step { width: 100%; text-align: left; display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 9px 12px; border-left: 2px solid transparent; color: var(--muted); font-size: 14px; line-height: 1.4; transition: color .2s, border-color .2s, background .2s; }
.step:hover { color: var(--text); background: rgba(15,31,77,0.022); }
.step.on { color: var(--text); border-left-color: var(--green); background: rgba(15,31,77,0.028); }
.step i { font-size: 17px; margin-top: 1px; color: var(--dim); }
.step i.ok { color: var(--green); } .step i.problem { color: var(--red); } .step i.question { color: var(--amber); }
.step > span:nth-child(2) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.step .avs .av { width: 20px; height: 20px; font-size: 9px; border-width: 1.5px; margin-left: -4px; }
.rail-h { font-size: 13px; color: var(--dim); padding: 0 12px 10px; display: flex; justify-content: space-between; }

.pane { min-width: 0; animation: fade .35s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
.kicker { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px var(--sans); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.tag.ok { background: var(--green-soft); color: var(--green); }
.tag.warn { background: var(--amber-soft); color: var(--amber); }
.tag.bad { background: var(--red-soft); color: var(--red); }
.tag.dim { background: rgba(15,31,77,0.044); color: var(--muted); }
.pane h2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-top: 12px; max-width: 60ch; line-height: 1.3; }
.pane p.lead { color: var(--muted); font-size: 15.5px; margin-top: 10px; max-width: 70ch; }
.sec { margin-top: 26px; }
.sec-h { font-size: 13px; color: var(--dim); margin-bottom: 10px; }

.quote { margin-top: 16px; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-2); color: var(--muted); max-width: 75ch; }
.quote small { display: block; color: var(--dim); font-size: 12.5px; margin-bottom: 2px; }
.checks { list-style: none; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 14.5px; color: var(--muted); }
.checks i { font-size: 17px; margin-top: 2px; }
.conf { margin-top: 14px; font-size: 13.5px; color: var(--dim); }
.conf s { text-decoration-color: var(--dim); }

.stats2 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 20px; }
.stats2 > div { padding: 18px 20px; }
.stats2 > div + div { border-left: 1px solid var(--line); }
.stats2 b { display: block; font: 600 28px/1.1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stats2 span { font-size: 13px; color: var(--muted); }

.rows { border-top: 1px solid var(--line); }
.rows > div { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.rows > div > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.note { margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 14.5px; }
.note.ok { background: var(--green-soft); color: var(--green); }
.note.warn { background: var(--amber-soft); color: var(--amber); }
.note.bad { background: var(--red-soft); color: var(--red); }
.note.info { background: rgba(15,31,77,0.039); color: var(--muted); }
details.issue { margin-top: 18px; }
details.issue summary { cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.issue summary::-webkit-details-marker { display: none; }
details.issue[open] summary i { transform: rotate(90deg); }
details.issue summary i { transition: transform .2s; }
pre.req { white-space: pre-wrap; font: 12.5px/1.6 var(--mono); color: var(--muted); background: var(--bg-2); border: 1px solid var(--line); padding: 16px; border-radius: 12px; max-height: 380px; overflow: auto; margin-top: 10px; }

/* Code */
.file { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 12px; background: var(--bg-2); }
.fh { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); font: 12.5px var(--mono); color: var(--muted); }
.fh .p { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fh .c { margin-left: auto; white-space: nowrap; color: var(--dim); }
.fh .c b { color: var(--amber); font-weight: 500; }
.code { font: 12.5px/1.7 var(--mono); overflow-x: auto; }
.ln { display: grid; grid-template-columns: 52px 16px 1fr; white-space: pre; color: #1f2a44; }
.ln.anim { opacity: 0; animation: lnin .3s forwards; }
@keyframes lnin { to { opacity: 1; } }
.ln .n { color: var(--dim); text-align: right; padding-right: 10px; user-select: none; }
.ln .s { color: var(--dim); user-select: none; }
.ln.add { background: rgba(22,163,74,0.06); }
.ln.add .s { color: var(--green); }
.ln.del { background: rgba(220,38,38,0.06); color: #9aa2b5; text-decoration: line-through; text-decoration-color: rgba(220,38,38,0.4); }
.ln.read { background: rgba(217,119,6,0.09); box-shadow: inset 2px 0 0 var(--amber); }
.gap { color: var(--dim); font: 12px var(--mono); padding: 2px 14px; background: rgba(15,31,77,0.017); }
.fold { display: flex; align-items: center; gap: 10px; padding: 11px 14px; color: var(--green); font-size: 14px; }
.fold button { margin-left: auto; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line-2); }
.fold button:hover { color: var(--text); }
.legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--dim); margin-top: 18px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Thread + forms */
.thread { margin-top: 24px; display: grid; gap: 10px; }
.msg { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 14.5px; }
.msg .h { font-size: 12.5px; color: var(--dim); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.msg.ai { background: rgba(15,31,77,0.022); }
.compose { margin-top: 16px; border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; display: grid; gap: 10px; animation: fade .25s var(--ease); }
.compose label { font-size: 13px; color: var(--muted); }
textarea, input[type=text] { width: 100%; font: 14.5px/1.5 var(--sans); color: var(--text); background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; resize: vertical; }
textarea::placeholder, input::placeholder { color: var(--dim); }
textarea:focus, input:focus { outline: none; border-color: rgba(22,163,74,0.55); }
.compose .row { display: flex; gap: 8px; justify-content: flex-end; }

/* Action bar */
.actbar { position: sticky; bottom: 0; margin-top: 32px; padding: 14px 0 18px; background: linear-gradient(180deg, rgba(255,255,255,0.0), var(--bg) 30%); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.actbar .sp { flex: 1; }
.keys { font-size: 12.5px; color: var(--dim); margin-right: 6px; }
.keys kbd { font: 11.5px var(--mono); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
.err { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--red-soft); color: var(--red); font-size: 14px; }

/* Name gate */
.gate { max-width: 420px; margin: 18vh auto 0; padding: 0 24px; }
.gate h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.gate p { color: var(--muted); margin: 8px 0 18px; }
.gate form { display: flex; gap: 8px; }

.skel { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sh 1.4s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) { .pane, .compose, .ln.anim { animation: none; opacity: 1; } .skel { animation: none; } }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .rail { position: static; max-height: none; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .stats2 { grid-template-columns: 1fr 1fr; }
  .stats2 > div:nth-child(3) { border-left: 0; }
  .stats2 > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .crumb .repo, .crumb .repo + span { display: none; }
  .pane { order: -1; }
  .rail { border-bottom: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .keys { display: none; }
}
@media (max-width: 560px) { .page { padding: 20px 16px 120px; } header.bar .in { padding: 0 16px; } .right .name { display: none; } }

/* light theme */
html { color-scheme: light; }
.hero h1 .g, h1 .hl { color: inherit; background: linear-gradient(180deg, transparent 60%, var(--hl) 60%); padding: 0 .06em; }
</style>
</head>
<body>
<header class="bar">
  <div class="in">
    <a class="brand" href="/app#/repo">
      <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#0f1f4d" stroke="rgba(15,31,77,0.138)"/><path d="M7 7.5 13 18.5 19 7.5" fill="none" stroke="#86efac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Vouch
    </a>
    <div class="crumb" id="crumb"></div>
    <div class="right" id="right"></div>
  </div>
</header>
<main id="app"></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (n) => String(n).split(/[\s._-]+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "?";
const COLORS = ["#86efac", "#93c5fd", "#fcd34d", "#f9a8d4", "#a5b4fc", "#5eead4"];
const color = (n) => COLORS[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const avatar = (u, title) => `<span class="av" style="background:${color(u)}" title="${esc(title || u)}">${esc(initials(u))}</span>`;
const fmt = (n) => Number(n).toLocaleString("en-US");
const REPO = "te-industry-tech-office/junction26-messagepack-csharp";
const ROUTE = { blocked: ["Blocked: something broke", "bad"], full: ["Read everything", "warn"], focused: ["Focused review", "dim"], light: ["Quick check", "ok"] };
const VOTE_WORD = { ok: "approved", question: "asked", problem: "reported a problem" };

const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : { credentials: "same-origin" });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.detail || `Request failed (${r.status})`); e.status = r.status; throw e; }
  return j;
};

// ------------------------------------------------------------ who am I
let me = null, ME = null;
async function identify() {
  const asParam = new URLSearchParams(location.search).get("as");
  try { ME = await api("/api/me"); } catch { ME = null; }
  if (asParam && asParam !== "demo") return asParam;      // named link from the board or a teammate
  if (ME && !ME.demo) return ME.login;                     // real GitHub user
  try { const n = localStorage.getItem("vouch-name"); if (n) return n; } catch {}
  return null;                                             // demo login: ask for a name once
}
function nameGate() {
  $("#app").innerHTML = `<div class="gate"><h1>What should your team call you?</h1>
    <p>Your name shows next to the steps you review and the votes you cast.</p>
    <form id="nf"><input type="text" id="nm" placeholder="Your name" maxlength="40" required autofocus><button class="btn btn-primary" type="submit">Continue</button></form></div>`;
  $("#nf").onsubmit = (e) => {
    e.preventDefault(); const n = $("#nm").value.trim(); if (!n) return;
    try { localStorage.setItem("vouch-name", n); } catch {}
    me = n; start();
  };
}
function renderRight() {
  const here = S ? Object.keys(S.presence).filter((u) => u !== me) : [];
  $("#right").innerHTML = `${here.length ? `<span class="avs" title="Reviewing now">${here.map((u) => avatar(u, u + " is here")).join("")}</span>` : ""}
    ${avatar(me)}<span class="name">${esc(me)}</span>`;
}

// ------------------------------------------------------------ review state
let P, S, cur = 0, live, beat, prId, compose = null, lastStep = null;

function stopLive() { if (live) live.close(); clearInterval(beat); live = beat = null; }

async function showPR(id) {
  stopLive();
  prId = id;
  $("#app").innerHTML = `<div class="page"><div class="skel" style="width:40%;height:26px"></div><div class="skel" style="width:60%;margin-top:14px"></div><div class="skel" style="height:300px;margin-top:28px;border-radius:14px"></div></div>`;
  let r;
  try { r = await api(`/api/prs/${id}`); }
  catch (e) { $("#app").innerHTML = `<div class="page"><div class="err">Could not load pull request #${esc(id)}. ${esc(e.message)}</div><p style="margin-top:14px"><a class="g" href="/app#/repo">Back to pull requests</a></p></div>`; return; }
  P = r.pack; S = r.state;
  cur = Math.max(0, Math.min(cur, P.steps.length - 1));
  render(true);
  live = new EventSource(`/api/prs/${id}/stream`);
  live.onmessage = async (e) => { if (e.data === "changed") refresh(); };
  const ping = () => api(`/api/prs/${id}/presence`, { user: me, step: P.steps[cur].id }).then(() => {}).catch(() => {});
  ping(); beat = setInterval(() => { ping(); refresh(); }, 5000);  // poll too: on serverless the push may come from another instance
}
async function refresh() {
  try {
    const st = (await api(`/api/prs/${prId}`)).state;
    if (JSON.stringify(st) === JSON.stringify(S)) return;
    S = st;
    if (document.activeElement?.matches("textarea,input")) { renderRight(); return; }  // never steal focus mid-typing
    render(false);
  } catch {}
}

function go(i) {
  const n = Math.max(0, Math.min(P.steps.length - 1, i));
  if (n === cur) return;
  cur = n; compose = null;
  history.replaceState(null, "", `${location.pathname}${location.search}#/pr/${prId}/${cur + 1}`);
  render(true);
  api(`/api/prs/${prId}/presence`, { user: me, step: P.steps[cur].id }).catch(() => {});
  window.scrollTo({ top: 0 });
}

function render(animate) {
  const st = P.stats, g = P.guard, step = P.steps[cur];
  const draft = $("#draft")?.value, risk = $("#risk")?.value;   // keep what the user is typing across live refreshes
  $("#crumb").innerHTML = `<span>/</span><a class="repo" href="/app#/repo">${esc(REPO)}</a><span>/</span><span class="cur">#${esc(P.id)}</span>`;
  renderRight();
  const here = (sid) => Object.entries(S.presence).filter(([u, s]) => s === sid && u !== me).map(([u]) => avatar(u, u + " is here")).join("");
  const icon = (s, i) => {
    const m = S.status[s.id];
    if (s.kind === "sign") return S.signoff ? `<i class="ph-fill ph-seal-check ok"></i>` : `<i class="ph ph-signature"></i>`;
    return m === "ok" ? `<i class="ph-fill ph-check-circle ok"></i>` : m === "problem" ? `<i class="ph-fill ph-x-circle problem"></i>`
      : m === "question" ? `<i class="ph-fill ph-question question"></i>` : `<i class="ph ph-circle"></i>`;
  };
  const guardTxt = !g.ran ? `<span class="a">existing tests not run</span>` : g.regression ? `<b class="r">${g.regression}</b> existing tests now fail` : `<b>${g.kept}/${g.existing}</b> existing tests still pass`;
  const route = ROUTE[P.route] || ["Review", "dim"];
  $("#app").innerHTML = `<div class="page">
    <div class="top">
      <h1><span class="id">#${esc(P.id)}</span>${esc(P.requirement.title.replace(/^#?\d+\s*/, ""))}</h1>
      <div class="meta">
        <span><b>${fmt(st.changed_lines)}</b> lines changed</span>
        <span>you read <b class="g">${fmt(st.lines_to_read)}</b>, about ${st.minutes} min</span>
        <span>${guardTxt}</span>
        <span><b>${S.done}/${S.total}</b> steps approved</span>
        <span class="tag ${route[1]}">${route[0]}</span>
        ${S.signoff ? `<span class="tag ${S.signoff.decision === "accept" ? "ok" : "bad"}">${S.signoff.decision === "accept" ? "Signed" : "Rejected"} by ${esc(S.signoff.user)}</span>` : ""}
      </div>
      <div class="prog"><span style="width:${S.total ? (100 * S.done) / S.total : 0}%"></span></div>
    </div>
    <div class="layout">
      <nav class="rail" aria-label="Review steps">
        <div class="rail-h"><span>Steps</span><span>${cur + 1} of ${P.steps.length}</span></div>
        ${P.steps.map((s, i) => `<button class="step ${i === cur ? "on" : ""}" onclick="go(${i})" title="${esc(s.title)}">${icon(s, i)}<span>${esc(s.title)}</span><span class="avs">${here(s.id)}</span></button>`).join("")}
      </nav>
      <section class="pane" ${animate ? "" : 'style="animation:none"'}>${stepView(step, animate && lastStep !== step.id)}</section>
    </div>
  </div>`;
  lastStep = step.id;
  if (draft != null && $("#draft")) $("#draft").value = draft;
  if (risk != null && $("#risk")) $("#risk").value = risk;
}

// ------------------------------------------------------------ step views
function stepView(s, animate) {
  const body = { guard: vGuard, story: vStory, claim: vClaim, refusal: vRefusal, generated: vGenerated, leftovers: vLeftovers, sign: vSign }[s.kind](s, animate);
  return body + (s.kind === "sign" ? "" : thread(s) + actionBar(s));
}

function vGuard() {
  const g = P.guard;
  if (!g.ran) return `<div class="kicker">Guardrail</div><h2>Existing tests were not run</h2>
    <div class="note warn">${esc(g.why || "")} Treat this change as unproven and read all of it.</div>`;
  if (g.regression) return `<div class="kicker">Guardrail</div><h2>Something that worked before is now broken</h2>
    <div class="note bad">${g.regression} existing test${g.regression > 1 ? "s" : ""} passed before this change and fail${g.regression > 1 ? "" : "s"} after it. Vouch blocks this change until it is fixed.</div>
    <div class="sec"><div class="sec-h">Broken tests</div><div class="rows">${g.regressions.map((r) => `<div><span>${esc(r.test)}</span><span>${esc(r.before)} <span class="d">→</span> <span class="r">${esc(r.after)}</span></span></div>`).join("")}</div></div>`;
  return `<div class="kicker">Guardrail</div><h2>Nothing that worked before is broken</h2>
    <p class="lead">Vouch ran the existing tests on the code before the change and on the agent's branch. The AI did not run them.</p>
    <div class="stats2">
      <div><b>${g.existing}</b><span>existing tests, before</span></div>
      <div><b class="g">${g.kept}</b><span>still pass after</span></div>
      <div><b class="${g.regression ? "r" : "g"}">${g.regression}</b><span>broken by this change</span></div>
      <div><b>${g.new_tests}</b><span>new tests added</span></div>
    </div>
    <p class="conf">Test project: ${g.projects.map((p) => `<code>${esc(p.split("/").pop())}</code>`).join(", ")}</p>`;
}

function vStory() {
  const st = P.stats;
  const files = P.files.filter((f) => f.kind !== "generated");
  return `<div class="kicker">The change</div><h2>What this change does</h2>
    <p class="lead" style="color:var(--text)">${esc(P.summary || "The AI gave no explanation. Read every line.")}</p>
    <div class="note info">${fmt(st.changed_lines)} lines changed in ${st.files} files. Lines backed by a passing test are folded away. <b style="color:var(--text)">You read ${fmt(st.lines_to_read)}.</b></div>
    ${P.missing.length ? `<div class="note warn">Part of the review is missing: ${P.missing.map(esc).join(", ")}. Nothing was folded away for that part.</div>` : ""}
    <details class="issue"><summary><i class="ph ph-caret-right"></i>Read the original issue</summary><pre class="req">${esc(P.requirement.text)}</pre></details>
    <div class="sec"><div class="sec-h">Files</div><div class="rows">
      ${files.map((f) => `<div><span>${esc(f.path)}</span><span>${f.hunks.reduce((n, h) => n + h.lines.filter((l) => l.t === "+").length, 0)} lines <span class="d">· ${esc(f.kind)}</span></span></div>`).join("")}
      ${P.generated ? `<div><span>${P.generated.files} generated files</span><span>${fmt(P.generated.lines)} lines <span class="d">· generated</span></span></div>` : ""}
    </div></div>`;
}

function vClaim(s, animate) {
  const c = P.claims.find((x) => x.id === s.claim);
  const label = { proven: ["Proven by a passing test", "ok", "ph-seal-check"], unproven: ["Not proven: read it", "warn", "ph-warning"], disputed: ["A check failed: read it", "bad", "ph-x-circle"] }[c.status];
  return `<div class="kicker"><span class="tag ${label[1]}"><i class="ph ${label[2]}"></i>${label[0]}</span></div>
    <h2>${esc(c.title || c.text)}</h2>
    ${c.title ? `<p class="lead">${esc(c.text)}</p>` : ""}
    ${c.requirement_quote ? `<div class="quote"><small>From the issue</small>${esc(c.requirement_quote)}</div>` : ""}
    <div class="sec"><div class="sec-h">Checked by code</div><ul class="checks">
      ${c.checks.map((k) => `<li><i class="ph-fill ${k.ok ? "ph-check-circle g" : "ph-x-circle r"}"></i><span>${esc(k.msg)}</span></li>`).join("")}
    </ul>
    ${c.tests.length ? `<p class="conf">Tests: ${c.tests.map((t) => `<code>${esc(t)}</code>`).join(" ")}</p>` : ""}
    <p class="conf">The AI says it is ${Math.round(c.confidence * 100)}% sure. <s>Not used.</s> Only the checks above count.</p></div>
    ${legend()}
    ${[...new Set(c.cites.map((x) => x.path))].map((path) => fileView(path, c.cites.filter((x) => x.path === path).map((x) => [x.start, x.end]), c.status === "proven", animate)).join("")}`;
}

function vRefusal(s, animate) {
  const r = P.refusals[s.refusal];
  return `<div class="kicker"><span class="tag bad"><i class="ph ph-lock-key"></i>Never folds</span></div>
    <h2>A person must decide this</h2>
    <div class="note bad">${esc(r.why)} Vouch keeps this open even when every test passes.</div>
    ${legend()}${fileView(r.path, r.ranges, false, animate)}`;
}

function vGenerated(s, animate) {
  const g = P.generated;
  return `<div class="kicker">Generated code</div><h2>${g.files} generated files</h2>
    <div class="note ${g.ok ? "ok" : "warn"}">${g.ok ? `${g.same} of ${g.files} files got exactly the same edit. Checked by code, nothing to read there.` : "These generated files all differ. Read them."}</div>
    <div class="sec"><div class="sec-h">The shared edit</div><pre class="req" style="margin-top:0">${g.distinct_edits.map(esc).join("\n")}</pre></div>
    ${g.odd.length && g.ok ? `<div class="note warn">${g.odd.length} file${g.odd.length > 1 ? "s differ" : " differs"} from the others. Read ${g.odd.length > 1 ? "them" : "it"}.</div>${legend()}${g.odd.map((p) => fileView(p, [[1, 99999]], false, animate)).join("")}` : ""}`;
}

function vLeftovers(s, animate) {
  return `<div class="kicker">Unexplained</div><h2>Changes nobody explained</h2>
    <div class="note warn">The AI did not mention these lines. They may be outside the issue. Read them.</div>
    ${legend()}${s.items.map((it) => fileView(it.path, it.ranges, false, animate)).join("")}`;
}

function vSign() {
  const left = S.total - S.done;
  const who = P.steps.filter((x) => x.kind !== "sign").map((x) => {
    const v = Object.values(S.votes[x.id] || {});
    return `<div><span>${esc(x.title)}</span><span>${v.length ? v.map((y) => `${esc(y.user)} <span class="${y.vote === "ok" ? "g" : y.vote === "problem" ? "r" : "a"}">${VOTE_WORD[y.vote]}</span>`).join(", ") : '<span class="d">nobody yet</span>'}</span></div>`;
  }).join("");
  if (S.signoff) return `<div class="kicker">Sign-off</div><h2>${S.signoff.decision === "accept" ? "Accepted" : "Rejected"} by ${esc(S.signoff.user)}</h2>
    <div class="note ${S.signoff.decision === "accept" ? "ok" : "bad"}"><b>Risk accepted:</b> ${esc(S.signoff.risk)}</div>
    <div class="sec"><div class="sec-h">Who reviewed what</div><div class="rows">${who}</div></div>
    <div class="actbar"><button class="btn btn-ghost" onclick="resetReview()"><i class="ph ph-arrow-counter-clockwise"></i>Start the review again</button></div>`;
  return `<div class="kicker">Sign-off</div><h2>Sign this change</h2>
    ${P.route === "blocked" ? `<div class="note bad">An existing test broke. This change cannot be accepted.</div>` : ""}
    ${left ? `<div class="note warn">${left} step${left > 1 ? "s" : ""} still need${left > 1 ? "" : "s"} an approval from someone on the team.</div>` : `<div class="note ok">Every step has been approved by the team.</div>`}
    <div class="sec"><div class="sec-h">Who reviewed what</div><div class="rows">${who}</div></div>
    <div class="sec"><label class="sec-h" for="risk" style="display:block">The risk you accept, in one sentence</label>
      <textarea id="risk" rows="2" placeholder="For example: only tested on .NET 8, and the third crash site in the issue is unchanged."></textarea></div>
    <div id="signErr"></div>
    <div class="actbar">
      <button class="btn btn-primary" ${left || P.route === "blocked" ? "disabled" : ""} onclick="sign('accept')"><i class="ph ph-signature"></i>Accept and sign as ${esc(me)}</button>
      <button class="btn btn-ghost" onclick="sign('reject')">Reject</button>
      <span class="sp"></span>
      <button class="btn btn-ghost icon-btn" onclick="go(cur-1)" aria-label="Previous step"><i class="ph ph-arrow-left"></i></button>
    </div>`;
}

function thread(s) {
  const asks = S.asks.filter((a) => a.step === s.id);
  const notes = Object.values(S.votes[s.id] || {}).filter((v) => v.note);
  const items = notes.map((v) => `<div class="msg"><div class="h">${avatar(v.user)}${esc(v.user)} ${VOTE_WORD[v.vote]}</div>${esc(v.note)}</div>`).join("")
    + asks.map((a) => `<div class="msg"><div class="h">${avatar(a.user)}${esc(a.user)} asked</div>${esc(a.question)}</div>
      <div class="msg ai"><div class="h"><i class="ph ph-sparkle"></i>AI answer, not evidence</div>${esc(a.answer)}</div>`).join("");
  const box = compose === "ask" ? `<div class="compose"><label for="draft">Ask the AI about this step. The answer is shown to the team and never counts as evidence.</label>
      <textarea id="draft" rows="2" placeholder="Why is the third crash site not changed?"></textarea>
      <div class="row"><button class="btn btn-ghost" onclick="closeCompose()">Cancel</button><button class="btn btn-primary" id="sendBtn" onclick="sendAsk()">Ask</button></div></div>`
    : compose === "problem" ? `<div class="compose"><label for="draft">What is wrong with this step?</label>
      <textarea id="draft" rows="2" placeholder="The filter also drops diagnostics we need."></textarea>
      <div class="row"><button class="btn btn-ghost" onclick="closeCompose()">Cancel</button><button class="btn btn-primary" onclick="sendProblem()">Report problem</button></div></div>` : "";
  return `${items ? `<div class="thread">${items}</div>` : ""}${box}<div id="actErr"></div>`;
}

function actionBar(s) {
  const mine = (S.votes[s.id] || {})[me];
  return `<div class="actbar">
    <button class="btn btn-primary" onclick="vote('ok')"><i class="ph ph-check"></i>${mine?.vote === "ok" ? "Approved" : "Looks right"}</button>
    <button class="btn btn-ghost" onclick="openCompose('ask')"><i class="ph ph-question"></i>Ask</button>
    <button class="btn btn-ghost ${mine?.vote === "problem" ? "on-problem" : ""}" onclick="openCompose('problem')"><i class="ph ph-flag"></i>Problem</button>
    <span class="sp"></span>
    <span class="keys"><kbd>A</kbd> approve <kbd>←</kbd> <kbd>→</kbd> move</span>
    <button class="btn btn-ghost icon-btn" onclick="go(cur-1)" aria-label="Previous step" ${cur === 0 ? "disabled" : ""}><i class="ph ph-arrow-left"></i></button>
    <button class="btn btn-ghost" onclick="go(cur+1)">Next<i class="ph ph-arrow-right"></i></button>
  </div>`;
}

function legend() {
  return `<div class="legend"><span><i style="background:rgba(217,119,6,0.35)"></i>Read this</span><span><i style="background:rgba(22,163,74,0.3)"></i>Added</span><span><i style="background:rgba(220,38,38,0.3)"></i>Removed</span></div>`;
}

// A file's changed lines in the given ranges (plus 3 lines of context). Proven code starts folded.
function fileView(path, rngs, folded, animate) {
  const f = P.files.find((x) => x.path === path);
  if (!f) return `<div class="note bad">The AI cited <code>${esc(path)}</code>, which this change does not touch.</div>`;
  const want = (n) => n != null && rngs.some(([a, b]) => n >= a - 3 && n <= b + 3);
  const reading = new Set((P.reading[path] || []).flatMap(([a, b]) => Array.from({ length: b - a + 1 }, (_, i) => a + i)));
  const rows = []; let last = null, k = 0, count = 0, toRead = 0;
  for (const h of f.hunks) for (const l of h.lines) {
    const n = l.new ?? l.old;
    if (!want(l.t === "-" ? nearNew(h, l) : l.new)) continue;
    if (last !== null && n > last + 1 && l.t !== "-") rows.push(`<div class="gap">···</div>`);
    if (l.t === "+") { count++; if (reading.has(l.new)) toRead++; }
    const cls = l.t === "+" ? (reading.has(l.new) ? "add read" : "add") : l.t === "-" ? "del" : "";
    rows.push(`<div class="ln ${cls}${animate ? " anim" : ""}"${animate ? ` style="animation-delay:${Math.min(k++ * 10, 500)}ms"` : ""}><span class="n">${l.new ?? ""}</span><span class="s">${l.t === " " ? "" : l.t}</span><span>${esc(l.text)}</span></div>`);
    if (l.t !== "-") last = l.new;
  }
  const short = path.length > 70 ? "…" + path.slice(-69) : path;
  const head = `<div class="fh"><span class="p" title="${esc(path)}">${esc(short)}</span><span class="c">${count} line${count === 1 ? "" : "s"}${toRead ? ` · <b>${toRead} to read</b>` : ""}</span></div>`;
  if (folded && !toRead) {
    const id = "f" + Math.random().toString(36).slice(2);
    return `<div class="file">${head}<div class="fold"><i class="ph-fill ph-check-circle"></i><span>${count} line${count === 1 ? "" : "s"} backed by passing tests. No need to read.</span>
      <button onclick="document.getElementById('${id}').hidden=false;this.parentElement.remove()">Show anyway</button></div>
      <div class="code" id="${id}" hidden>${rows.join("")}</div></div>`;
  }
  return `<div class="file">${head}<div class="code">${rows.join("")}</div></div>`;
}
function nearNew(h, l) { const i = h.lines.indexOf(l); for (let j = i; j < h.lines.length; j++) if (h.lines[j].new != null) return h.lines[j].new; return null; }

// ------------------------------------------------------------ actions
const showErr = (where, e) => { const el = $(where); if (el) el.innerHTML = `<div class="err">${esc(e.message || e)}</div>`; };
function openCompose(kind) { compose = compose === kind ? null : kind; render(false); $("#draft")?.focus(); }
function closeCompose() { compose = null; render(false); }
async function vote(v, note = "") {
  try {
    await api(`/api/prs/${prId}/vote`, { user: me, step: P.steps[cur].id, vote: v, note });
    if (v === "ok") { S.status[P.steps[cur].id] = "ok"; go(cur + 1); } else refresh();
  } catch (e) { showErr("#actErr", e); }
}
async function sendProblem() {
  const note = $("#draft").value.trim();
  if (!note) { $("#draft").focus(); return; }
  compose = null; await vote("problem", note);
}
async function sendAsk() {
  const q = $("#draft").value.trim();
  if (!q) { $("#draft").focus(); return; }
  const b = $("#sendBtn"); b.disabled = true; b.textContent = "Asking…";
  try { await api(`/api/prs/${prId}/ask`, { user: me, step: P.steps[cur].id, question: q }); compose = null; await refresh(); render(false); }
  catch (e) { b.disabled = false; b.textContent = "Ask"; showErr("#actErr", e); }
}
async function sign(decision) {
  try { await api(`/api/prs/${prId}/signoff`, { user: me, decision, risk: $("#risk").value }); await refresh(); }
  catch (e) { showErr("#signErr", e); }
}
async function resetReview() {
  if (!confirm("Clear every vote and the sign-off for this change?")) return;
  try { await api(`/api/prs/${prId}/reset`, {}); await refresh(); } catch (e) { alert(e.message); }
}

document.addEventListener("keydown", (e) => {
  if (!P || e.target.closest("textarea,input") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "a" && P.steps[cur].kind !== "sign") vote("ok");
});

function route() {
  const m = location.hash.match(/^#\/pr\/(\w+)(?:\/(\d+))?/);
  if (!m) { location.href = "/app#/repo"; return; }
  const step = m[2] ? +m[2] - 1 : 0;
  if (m[1] !== prId) { cur = step; showPR(m[1]); }
  else if (step !== cur) { cur = step; render(true); }
}
async function start() {
  window.addEventListener("hashchange", route);
  route();
}
(async () => {
  me = await identify();
  if (!me) return nameGate();
  start();
})();
</script>
</body>
</html>
